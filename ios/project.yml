# XcodeGen spec for the native DyorHQ app. Regenerate the project with `xcodegen generate` from this folder.
name: DyorHQ
options:
  bundleIdPrefix: fun.dyorhq
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configFiles:
  Debug: DyorHQ/Config/Secrets.xcconfig
  Release: DyorHQ/Config/Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  DyorKit:
    path: DyorKit
  Privy:
    url: https://github.com/privy-io/privy-ios
    from: 2.15.0

targets:
  DyorHQ:
    type: application
    platform: iOS
    sources:
      - path: DyorHQ
        excludes:
          - "Config/*.xcconfig"
    dependencies:
      - package: DyorKit
      - package: Privy
        product: Privy
    info:
      path: DyorHQ/Info.plist
      properties:
        CFBundleDisplayName: DyorHQ
        CFBundleName: DyorHQ
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "3"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: DyorHQ uses Face ID to unlock your wallet on this device.
        NSCameraUsageDescription: DyorHQ uses the camera to scan wallet addresses and QR codes.
        NSPhotoLibraryUsageDescription: DyorHQ uses your photos to add a token image when you launch a coin.
        CFBundleURLTypes:
          - CFBundleURLName: fun.dyorhq.app
            CFBundleURLSchemes: [dyorhq]
        LSApplicationQueriesSchemes: [https]
        # Values below are filled from Secrets.xcconfig at build time and read by Config.swift.
        PrivyAppID: "$(PRIVY_APP_ID)"
        PrivyClientID: "$(PRIVY_CLIENT_ID)"
        MonadRPCURL: "$(MONAD_RPC_URL)"
        PasskeyRelyingParty: "$(PASSKEY_RP_ID)"
        PerplBuilderID: "$(PERPL_BUILDER_ID)"
        LaunchpadFactory: "$(LAUNCHPAD_FACTORY)"
        LaunchRouter: "$(LAUNCH_ROUTER)"
        FeeEscrow: "$(FEE_ESCROW)"
        HolderFeeSharing: "$(HOLDER_FEE_SHARING)"
        MemeHook: "$(MEME_HOOK)"
        AuroraApiKey: "$(AURORA_API_KEY)"
        AuroraFeeRecipient: "$(AURORA_FEE_RECIPIENT)"
    entitlements:
      path: DyorHQ/DyorHQ.entitlements
      # Sign in with Apple (Guideline 4.8) + Associated Domains (Mera passkeys). These require the paid Apple
      # Developer team's ID in DEVELOPMENT_TEAM and both capabilities enabled on the fun.dyorhq.app App ID at
      # developer.apple.com. Passkeys additionally need the AASA file live at
      # https://$(PASSKEY_RP_ID)/.well-known/apple-app-site-association (PASSKEY_RP_ID = dyorhq.fun) before they
      # associate on a device or in TestFlight — there is no ?mode=developer suffix, so the real hosted file is
      # required. Simulator builds compile without any of this; only device/archive signing needs the paid team.
      # To ENABLE for TestFlight, once (a) DEVELOPMENT_TEAM is the paid team id, (b) Sign in with Apple + Associated
      # Domains are enabled on the fun.dyorhq.app App ID, and (c) the AASA is hosted at
      # https://$(PASSKEY_RP_ID)/.well-known/apple-app-site-association: uncomment applesignin and remove the
      # ?mode=developer suffix. Until then, ?mode=developer lets a Developer-Mode device read the AASA from the
      # origin directly. Passkeys stay broken until the AASA is live regardless — that is the owner's hosting step.
      properties:
        # com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["webcredentials:$(PASSKEY_RP_ID)?mode=developer"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.dyorhq.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
    preBuildScripts: []
