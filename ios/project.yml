# XcodeGen spec for the native DyorHQ app. Regenerate the project with `xcodegen generate` from this folder.
name: DyorHQ
options:
  bundleIdPrefix: fun.dyorhq
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configFiles:
  Debug: DyorHQ/Config/Secrets.xcconfig
  Release: DyorHQ/Config/Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  DyorKit:
    path: DyorKit
  # 2.16.2+ is REQUIRED for TestFlight external testing / App Store: 2.15.0 statically bundled SwiftyJSON (on
  # Apple's list of SDKs that must ship a privacy manifest + signature) without either, so every build was marked
  # Invalid Binary by Beta App Review (ITMS-91061 / ITMS-91065) while internal testing — which skips that check —
  # kept working. 2.16.2 removes the SwiftyJSON dependency (privy-io/privy-ios#86).
  Privy:
    url: https://github.com/privy-io/privy-ios
    from: 2.16.2

targets:
  DyorHQ:
    type: application
    platform: iOS
    sources:
      - path: DyorHQ
        excludes:
          - "Config/*.xcconfig"
    dependencies:
      - package: DyorKit
      - package: Privy
        product: Privy
    info:
      path: DyorHQ/Info.plist
      properties:
        CFBundleDisplayName: DyorHQ
        CFBundleName: DyorHQ
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "12"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only phone app: opt out of iPad multitasking so a single orientation is valid (fixes App Store
        # validation error 90474, which otherwise demands all four orientations for multitasking-capable bundles).
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: DyorHQ uses Face ID to unlock your wallet on this device.
        NSCameraUsageDescription: DyorHQ uses the camera to scan wallet addresses and QR codes.
        NSPhotoLibraryUsageDescription: DyorHQ uses your photos to add a token image when you launch a coin.
        CFBundleURLTypes:
          - CFBundleURLName: fun.dyorhq.app
            CFBundleURLSchemes: [dyorhq]
        LSApplicationQueriesSchemes: [https]
        # Values below are filled from Secrets.xcconfig at build time and read by Config.swift. EVERYTHING here ships
        # in plaintext inside the IPA, so only PUBLIC identifiers belong here — never an API key or a keyed URL
        # (scripts/testflight.sh refuses to upload an archive that contains one).
        PrivyAppID: "$(PRIVY_APP_ID)"
        PrivyClientID: "$(PRIVY_CLIENT_ID)"
        # Debug-only RPC override (a local anvil fork). Empty in Release by DYOR_DEBUG_RPC_OVERRIDE below, and ignored
        # by Release code anyway: shipped builds use the keyless public Monad RPCs (Monad.publicRPCs).
        MonadRPCURL: "$(DYOR_DEBUG_RPC_OVERRIDE)"
        PasskeyRelyingParty: "$(PASSKEY_RP_ID)"
        # Set SOCIAL_LOGINS_ENABLED=YES in Secrets.xcconfig once Apple/Google are enabled in the Privy dashboard;
        # until then onboarding hides them so no one taps a disallowed method. Unset resolves to false.
        SocialLoginsEnabled: "$(SOCIAL_LOGINS_ENABLED)"
        # Set PASSKEYS_ENABLED=YES once passkeys are live (associated-domains entitlement restored, the App ID
        # capabilities enabled, and the AASA hosted). Until then the UI hides passkey options. Unset resolves to false.
        PasskeysEnabled: "$(PASSKEYS_ENABLED)"
        PerplBuilderID: "$(PERPL_BUILDER_ID)"
        LaunchpadFactory: "$(LAUNCHPAD_FACTORY)"
        LaunchRouter: "$(LAUNCH_ROUTER)"
        FeeEscrow: "$(FEE_ESCROW)"
        HolderFeeSharing: "$(HOLDER_FEE_SHARING)"
        MemeHook: "$(MEME_HOOK)"
        # The Aurora API key is NOT here: it lives server-side in the aurora-proxy Edge Function (Supabase secret
        # AURORA_API_KEY). The fee recipient is a public NEAR account name.
        AuroraFeeRecipient: "$(AURORA_FEE_RECIPIENT)"
    entitlements:
      path: DyorHQ/DyorHQ.entitlements
      # Passkey entitlements (Sign in with Apple + Associated Domains) are DISABLED. They were first suspected for the
      # "Invalid Binary" builds, but builds 7–9 shipped with this empty set and were still invalid — the real cause was
      # PrivySDK 2.15.0's bundled SwiftyJSON (see the Privy package note above). The entitlements stay empty anyway:
      # a `?mode=developer` associated domain is never allowed in a DISTRIBUTION build, and the capabilities aren't
      # enabled on the fun.dyorhq.app App ID / the AASA isn't hosted — all pending owner steps. Passkeys don't work
      # until the AASA is live regardless, so an empty entitlements set loses nothing right now.
      # TO RE-ENABLE PASSKEYS later, once (a) Sign in with Apple + Associated Domains are enabled on the App ID at
      # developer.apple.com and (b) the AASA is hosted at https://$(PASSKEY_RP_ID)/.well-known/apple-app-site-association,
      # set properties back to (note: NO ?mode=developer suffix in a distribution build):
      #   com.apple.developer.applesignin: [Default]
      #   com.apple.developer.associated-domains: ["webcredentials:$(PASSKEY_RP_ID)"]
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.dyorhq.app
        # iPhone-only (1). XcodeGen's iOS-app preset injects "1,2" (universal) at the target level, which overrode the
        # project-level "1" and made the App Store validator demand all four orientations for iPad multitasking.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
      configs:
        # MONAD_RPC_URL (Secrets.xcconfig) reaches Info.plist in Debug only — a Release/TestFlight/App Store build
        # can never bake a provider URL, keyed or not.
        Debug:
          DYOR_DEBUG_RPC_OVERRIDE: "$(MONAD_RPC_URL)"
        Release:
          DYOR_DEBUG_RPC_OVERRIDE: ""
    preBuildScripts: []
