<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DyorHQ Preview</title>
<meta name="description" content="DyorHQ is a self-custodial mobile app on Monad for launching stock-backed memecoins, copying on-chain traders, and trading perps and swaps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* ===================== tokens ===================== */
:root{
  color-scheme:light;
  --ground:#E3E7DE; --bg:#F2F5EE; --card:#FFFFFF; --inner:#E9EDE4; --inner2:#DDE3D6; --track:#E0E5DA; --ring:rgba(12,16,13,.06); --card-hi:rgba(255,255,255,0); --mark-filter:brightness(0);
  --text:#0C100D; --muted:#5E6A5B; --strong:#2A322B; --faint:#7C877A;
  --accent:#B9F26B;
  --accent-ink:var(--accent-ink-light,#5C7C2B);
  --accent-fill:var(--accent-fill-js,var(--accent));
  --accent-soft:color-mix(in srgb,var(--accent) 12%,#FFFFFF);
  --on-accent:var(--on-accent-js,#0C100D);
  --up:#0E9F6E; --up-text:#0B7A50; --up-soft:#E5F9F1; --up-fill:#0B7A50; --on-up:#FFFFFF;
  --down:#E5484D; --down-text:#C42B3A; --down-soft:#FFEEF2; --down-fill:#D0303F; --on-down:#FFFFFF;
  --glass-bg:rgba(255,255,255,.62); --glass-rim:rgba(255,255,255,.92); --glass-ring:rgba(12,16,13,.08); --glass-sheen:.9;
  --glass-shadow:0 12px 32px -12px rgba(12,16,13,.28),0 1px 2px rgba(12,16,13,.06);
  --shadow-card:0 1px 2px rgba(12,16,13,.04),0 12px 28px -16px rgba(12,16,13,.18);
  --shadow-float:0 18px 40px -18px rgba(12,16,13,.35);
  --thumb-shadow:0 1px 2px rgba(12,16,13,.12),0 4px 12px -6px rgba(12,16,13,.25),inset 0 1px 0 rgba(255,255,255,.7);
  --bezel:linear-gradient(145deg,#dcdfe6,#8f96a3 28%,#4a515e 72%,#c9ced8);
  --r-card:20px; --r-row:12px; --r-input:14px; --r-pill:999px; --r-frame:54px;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --alt:"Inter Tight",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --font:var(--sans);
  --text-scale:1; --glass-blur:18px; --safe-top:0px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#060806; --bg:#0C100D; --card:#1B211D; --inner:#242C26; --inner2:#2E372F; --track:#283129; --ring:rgba(255,255,255,.06); --card-hi:rgba(255,255,255,.04); --mark-filter:none;
    --text:#F2F5EE; --muted:#98A494; --strong:#C8D1C2; --faint:#6F7B6C;
    --accent-ink:var(--accent-ink-dark,#C8F58B);
    --accent-fill:var(--accent-fill-js,var(--accent));
    --accent-soft:color-mix(in srgb,var(--accent) 16%,#1B211D);
    --up:#27DB91; --up-text:#2FE49B; --up-soft:#1C3A2E; --up-fill:#27DB91; --on-up:#0C100D;
    --down:#FF507A; --down-text:#FF6A8E; --down-soft:#3B282F; --down-fill:#FF507A; --on-down:#0C100D;
    --glass-bg:rgba(27,33,29,.58); --glass-rim:rgba(255,255,255,.16); --glass-ring:rgba(255,255,255,.08); --glass-sheen:.45;
    --glass-shadow:0 16px 40px -14px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.03);
    --shadow-card:0 1px 0 rgba(255,255,255,.02),0 12px 30px -16px rgba(0,0,0,.55);
    --shadow-float:0 20px 44px -18px rgba(0,0,0,.7);
    --thumb-shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
    --bezel:linear-gradient(145deg,#4a4f5a,#15181e 28%,#030405 72%,#4a4f5a);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#060806; --bg:#0C100D; --card:#1B211D; --inner:#242C26; --inner2:#2E372F; --track:#283129; --ring:rgba(255,255,255,.06); --card-hi:rgba(255,255,255,.04); --mark-filter:none;
  --text:#F2F5EE; --muted:#98A494; --strong:#C8D1C2; --faint:#6F7B6C;
  --accent-ink:var(--accent-ink-dark,#C8F58B);
  --accent-fill:var(--accent-fill-js,var(--accent));
  --accent-soft:color-mix(in srgb,var(--accent) 16%,#1B211D);
  --up:#27DB91; --up-text:#2FE49B; --up-soft:#1C3A2E; --up-fill:#27DB91; --on-up:#0C100D;
  --down:#FF507A; --down-text:#FF6A8E; --down-soft:#3B282F; --down-fill:#FF507A; --on-down:#0C100D;
  --glass-bg:rgba(27,33,29,.58); --glass-rim:rgba(255,255,255,.16); --glass-ring:rgba(255,255,255,.08); --glass-sheen:.45;
  --glass-shadow:0 16px 40px -14px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.03);
  --shadow-card:0 1px 0 rgba(255,255,255,.02),0 12px 30px -16px rgba(0,0,0,.55);
  --shadow-float:0 20px 44px -18px rgba(0,0,0,.7);
  --thumb-shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  --bezel:linear-gradient(145deg,#4a4f5a,#15181e 28%,#030405 72%,#4a4f5a);
}

/* ===================== base ===================== */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"ss01" 0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,select,textarea{border:0;outline:0;background:none}
svg.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
.num{font-variant-numeric:tabular-nums lining-nums}
.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.up{color:var(--up-text)} .down{color:var(--down-text)}
.muted{color:var(--muted)}

/* ===================== stage / device ===================== */
.stage{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;gap:clamp(32px,5vw,96px);padding:28px 36px}
.device{position:relative;width:440px;flex:none;height:min(956px,calc(100dvh - 56px));border-radius:var(--r-frame);padding:6px;background:var(--bezel);box-shadow:0 50px 110px -30px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.22)}
.device::before,.device::after{content:"";position:absolute;left:-3px;width:4px;border-radius:3px;background:linear-gradient(#6b7079,#2b2f36,#6b7079)}
.device::before{top:170px;height:74px}.device::after{top:262px;height:120px}
.edge{position:relative;height:100%;border-radius:48px;overflow:hidden;background:var(--bg);color:var(--text)}
.status{position:relative;z-index:30;height:50px;display:flex;align-items:center;justify-content:space-between;padding:12px 30px 0;font-size:15px;font-weight:600;pointer-events:none;letter-spacing:-.01em}
.island{position:absolute;left:50%;top:11px;width:122px;height:35px;border-radius:20px;background:#000;transform:translateX(-50%)}
.sys{display:flex;align-items:center;gap:7px}.sys svg{width:17px;height:17px;display:block}
.battery{width:27px;height:13px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.95}.battery::after{content:"";position:absolute;inset:2px;background:currentColor;border-radius:2px}
.app-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.app-scroll::-webkit-scrollbar{display:none}
.screen{padding:126px 20px 128px;animation:screenIn .22s cubic-bezier(.23,1,.32,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrim{position:absolute;left:0;right:0;top:0;height:124px;z-index:15;pointer-events:none;background:linear-gradient(color-mix(in srgb,var(--bg) 82%,transparent) 30%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}

/* ===================== liquid glass ===================== */
.glass{position:relative;background:var(--glass-bg);box-shadow:inset 0 1px 0 var(--glass-rim),inset 0 0 0 1px var(--glass-ring),var(--glass-shadow);backdrop-filter:blur(var(--glass-blur)) saturate(1.5);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--glass-sheen);background:linear-gradient(118deg,rgba(255,255,255,.26),rgba(255,255,255,0) 36%,rgba(255,255,255,0) 64%,rgba(255,255,255,.1))}
.glass>*{position:relative;z-index:1}

/* ===================== floating chrome ===================== */
.topbar{position:absolute;left:0;right:0;top:50px;height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;z-index:20;pointer-events:none}
.topbar>*{pointer-events:auto}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--strong);flex:none;transition:transform .12s ease-out}
.circ:active{transform:scale(.94)}
.search{flex:1;height:44px;border-radius:var(--r-pill);display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--muted);font-size:15px;min-width:0}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search .ic{width:19px;height:19px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:14px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--ring);flex:none;letter-spacing:.02em}
.bar-title{flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-spacer{width:44px;flex:none}
.bar-seg{flex:1;height:44px;border-radius:var(--r-pill);padding:4px}
.bar-seg>button{height:36px}
.tabbar{position:absolute;left:14px;right:14px;bottom:14px;height:66px;border-radius:var(--r-pill);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px;z-index:20}
.tab-thumb{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:var(--r-pill);background:var(--accent-soft);transform:translateX(calc(var(--i)*100%));transition:transform .38s cubic-bezier(.34,1.35,.64,1),opacity .2s;z-index:0}
.tab-thumb.hide{opacity:0}
.tab{position:relative;z-index:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);border-radius:var(--r-pill);transition:color .2s}
.tab small{font-size:11px;font-weight:600;line-height:1}
.tab.active{color:var(--accent-ink)}
.tab.launch .launch-btn{width:50px;height:50px;border-radius:50%;background:var(--accent-fill);color:var(--on-accent);display:grid;place-items:center;margin-top:-24px;box-shadow:0 10px 22px -8px color-mix(in srgb,var(--accent) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.32);transition:transform .12s ease-out}
.tab.launch:active .launch-btn{transform:scale(.94)}
.tab.launch small{margin-top:2px}
.tab.launch.active{color:var(--accent-ink)}

/* ===================== type ===================== */
.title{font-size:calc(22px*var(--text-scale));font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px}
.sec h2{font-size:calc(18px*var(--text-scale));font-weight:600;letter-spacing:-.02em;margin:0}
.sec .link{font-size:13px;font-weight:600;color:var(--accent-ink);display:inline-flex;align-items:center;gap:4px}
.sec .link .ic{width:16px;height:16px}
.label{font-size:13px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ===================== surfaces ===================== */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-card),inset 0 1px 0 var(--card-hi),0 0 0 1px var(--ring);padding:18px}
.inner{background:var(--inner);border-radius:var(--r-card)}
.divider{height:1px;background:var(--track);margin:16px 0}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--inner);border-radius:var(--r-pill);padding:4px;isolation:isolate}
.seg>button{position:relative;z-index:1;height:38px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .2s;white-space:nowrap;padding:0 6px}
.seg>button[aria-selected="true"]{color:var(--text)}
.seg>button .ic{width:16px;height:16px}
.seg-thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:var(--r-pill);background:var(--card);box-shadow:var(--thumb-shadow);transform:translateX(calc(var(--i)*100%));transition:transform .3s cubic-bezier(.23,1,.32,1),background .2s;z-index:0}
.seg.tone-up .seg-thumb{background:var(--up-fill)}.seg.tone-up>button[aria-selected="true"]{color:var(--on-up)}
.seg.tone-down .seg-thumb{background:var(--down-fill)}.seg.tone-down>button[aria-selected="true"]{color:var(--on-down)}
.seg.small>button{height:32px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chipbtn{height:34px;padding:0 12px;border-radius:10px;background:var(--inner);color:var(--muted);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s}
.chipbtn[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.btn{height:48px;padding:0 18px;border-radius:var(--r-input);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease-out,filter .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--accent-fill);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 22px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.secondary{background:var(--inner);color:var(--text)}
.btn.ghost{background:transparent;color:var(--accent-ink)}
.btn.tone-up{background:var(--up-fill);color:var(--on-up)}
.btn.tone-down{background:var(--down-fill);color:var(--on-down)}
.btn.big{height:54px;width:100%;font-size:16px;border-radius:16px}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.iconbtn{height:36px;padding:0 12px;border-radius:10px;background:var(--inner);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--strong);transition:transform .12s ease-out}
.iconbtn:active{transform:scale(.96)}
.iconbtn .ic{width:17px;height:17px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field textarea,.select{width:100%;background:var(--inner);border-radius:var(--r-input);padding:13px 14px;font-size:15px;color:var(--text);transition:box-shadow .15s}
.field input:focus,.field textarea:focus,.select:focus{box-shadow:0 0 0 2px var(--accent)}
.field textarea{resize:none;min-height:84px;line-height:1.45}
.select{appearance:none;-webkit-appearance:none;padding-right:38px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;font-weight:600;cursor:pointer}
.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--inner2);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.23,1,.32,1)}
.switch[aria-checked="true"]{background:var(--up-fill)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
input[type="range"].range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type="range"].range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent-ink) var(--pct,0%),var(--inner2) var(--pct,0%))}
input[type="range"].range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--accent-ink);margin-top:-9px;box-shadow:0 2px 6px rgba(12,16,13,.2)}
input[type="range"].range::-moz-range-track{height:4px;border-radius:2px;background:var(--inner2)}
input[type="range"].range::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent-ink)}
input[type="range"].range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--accent-ink);box-shadow:0 2px 6px rgba(12,16,13,.2)}

/* ===================== lists / rows ===================== */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;min-height:66px;padding:10px 0;border-bottom:1px solid var(--track);width:100%;transition:background .15s}
.row:last-child{border-bottom:0}
button.row:active{background:var(--inner)}
.rank{width:16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:left}
.coin{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none;box-shadow:inset 0 -2px 4px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.35);letter-spacing:-.02em}
.coin.lg{width:46px;height:46px;font-size:17px}.coin.sm{width:24px;height:24px;font-size:10px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-main b{font-size:calc(16px*var(--text-scale));font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:-.01em;line-height:1.2}
.row-main small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;align-items:center;gap:10px;flex:none}
.price{font-size:calc(16px*var(--text-scale));font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stack{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.stack small{font-size:13px;color:var(--muted)}
.chip{min-width:74px;height:32px;padding:0 10px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;gap:4px}
.chip.up{background:var(--up-soft);color:var(--up-text)}.chip.down{background:var(--down-soft);color:var(--down-text)}
.chip.neutral{background:var(--inner);color:var(--muted)}
.badge{font-size:10px;font-weight:600;letter-spacing:.06em;padding:3px 6px;border-radius:6px;background:var(--inner);color:var(--muted);line-height:1.2}
.badge.accent{background:var(--accent-soft);color:var(--accent-ink)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--up-text)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px var(--up-soft);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.meta-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;font-size:13px;color:var(--muted)}

/* ===================== home ===================== */
.balance{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0 18px;gap:12px}
.hero-num{font-size:calc(34px*var(--text-scale));font-weight:600;letter-spacing:-.035em;line-height:1.1;margin:4px 0 10px}
.delta{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.delta .chip{min-width:0;height:28px;padding:0 9px;font-size:13px}
.balance-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding-top:2px;flex:none}
.balance-side .val{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.net{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:5px 10px 5px 5px;border-radius:var(--r-pill);background:var(--inner);color:var(--text)}
.net i{width:24px;height:24px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700;font-style:normal}
.net .ic{width:16px;height:16px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--track);border-bottom:1px solid var(--track)}
.kv b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.action{height:78px;border-radius:18px;background:var(--inner);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;color:var(--text);transition:transform .12s ease-out,background .15s}
.action .ic{color:var(--strong);width:22px;height:22px}
.action:active{transform:scale(.97);background:var(--inner2)}

/* ===================== feed ===================== */
.feed{display:flex;flex-direction:column;gap:12px}
.post{padding:16px}
.post-head{display:flex;align-items:center;gap:10px}
.who{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.post-head .row-main b{font-size:15px}
.post-head time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.post-line{display:flex;align-items:center;gap:8px;margin:12px 0 8px;font-size:15px;font-weight:600}
.post-line .verb{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.post-line .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.post p{margin:0 0 10px;font-size:calc(15px*var(--text-scale));line-height:1.45;color:var(--text)}
.spark{height:56px;margin:2px -2px 8px}
.spark svg{width:100%;height:100%;display:block}
.post-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:12px}
.post-meta b{font-weight:600}
.post-actions{display:flex;gap:8px;align-items:center}
.post-actions .btn{margin-left:auto}
.verified{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--accent-ink);color:var(--card)}
.verified .ic{width:9px;height:9px;stroke-width:3}

/* ===================== markets / launch ===================== */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{padding:12px 12px 10px;border-radius:14px;background:var(--inner)}
.stat span{display:block;font-size:12px;color:var(--muted)}.stat b{display:block;font-size:15px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow-card),0 0 0 1px var(--ring)}
.tile span{font-size:13px;color:var(--muted)}.tile b{display:block;font-size:22px;font-weight:600;letter-spacing:-.025em;margin:6px 0 4px}.tile small{font-size:13px;color:var(--muted)}
.launch-hero{padding:22px 20px 20px;position:relative;overflow:hidden}
.launch-hero h1{font-size:calc(26px*var(--text-scale));line-height:1.1;letter-spacing:-.03em;margin:8px 0 10px;text-wrap:balance;font-weight:600}
.launch-hero p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.45;max-width:30ch}
.stack-art{position:absolute;right:16px;top:18px;display:flex;align-items:center}
.stack-art span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;box-shadow:0 8px 18px -6px rgba(0,0,0,.35)}
.stack-art span:first-child{background:#76B900;transform:rotate(-8deg)}
.stack-art span:last-child{background:var(--accent-fill);transform:rotate(8deg);margin-left:-8px}
.stack-art i{position:relative;z-index:2;width:22px;height:22px;border-radius:50%;background:var(--card);color:var(--text);display:grid;place-items:center;margin:0 -6px;font-style:normal;font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.launch-card{padding:16px}
.launch-top{display:flex;align-items:center;gap:12px}
.launch-top h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.launch-top p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.trust{display:flex;gap:6px;margin:12px 0}
.progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.progress-label b{color:var(--text);font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:3px;background:var(--inner2);margin:8px 0 14px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:3px;background:var(--accent-ink)}
.launch-stats{display:flex;align-items:center;gap:18px}
.launch-stats>span{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.launch-stats>span b{font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.launch-stats .btn{margin-left:auto}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0 16px}
.step-head h1{font-size:calc(24px*var(--text-scale));letter-spacing:-.03em;margin:4px 0 0;font-weight:600;line-height:1.15}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--accent-ink);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.form{display:flex;flex-direction:column;gap:14px;padding:18px}
.upload{height:92px;border:1.5px dashed color-mix(in srgb,var(--accent-ink) 50%,transparent);border-radius:16px;background:var(--accent-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;color:var(--accent-ink)}
.upload b{font-size:14px}.upload small{font-size:12px;color:var(--muted)}
.prefix{position:relative}.prefix span{position:absolute;left:14px;top:13px;color:var(--muted);font-size:15px}.prefix input{padding-left:30px}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair-grid button{position:relative;background:var(--inner);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;box-shadow:0 0 0 1.5px transparent;transition:box-shadow .15s,background .15s}
.pair-grid button b{display:block;font-size:14px}.pair-grid button small{display:block;font-size:12px;color:var(--muted)}
.pair-grid button[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--accent-ink);background:var(--accent-soft)}
.pair-grid .tick{position:absolute;right:8px;top:8px;width:18px;height:18px;border-radius:50%;background:var(--accent-fill);color:var(--on-accent);display:none;place-items:center}
.pair-grid .tick .ic{width:11px;height:11px;stroke-width:3}
.pair-grid button[aria-pressed="true"] .tick{display:grid}
.note{padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--text)}
.note b{font-size:14px;color:var(--accent-ink)}.note p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.review{display:flex;flex-direction:column}
.review-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--track);font-size:14px;color:var(--muted)}
.review-row b{color:var(--text);font-variant-numeric:tabular-nums}
.flow-actions{display:flex;gap:8px;margin-top:14px}.flow-actions .primary{flex:1}

/* ===================== trade ===================== */
.pairhd{display:flex;align-items:center;gap:10px;padding:2px 0 14px}
.pairhd .name{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.pairhd .name .ic{width:18px;height:18px;color:var(--muted)}
.pairhd .sub{font-size:13px;font-variant-numeric:tabular-nums;font-weight:600;margin-top:2px}
.pairhd .right{margin-left:auto;text-align:right}
.pricehd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:8px}
.pricehd .big{font-size:calc(28px*var(--text-scale));font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.pricehd .label{display:flex;align-items:center;gap:4px}
.pricehd .label .ic{width:14px;height:14px}
.stats-mini{display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:12px;color:var(--muted);text-align:right}
.stats-mini b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.chart-card{padding:12px 0 6px;position:relative}
.chart{position:relative;height:250px;margin:6px -4px 0}
.chart svg{width:100%;height:100%;display:block}
.chart .cross{position:absolute;top:0;bottom:22px;width:1px;background:var(--muted);opacity:0;pointer-events:none}
.chart-cap{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:6px 4px 0;font-variant-numeric:tabular-nums;min-height:24px;gap:8px}
.chart-cap b{color:var(--text);font-weight:600}
.legend{display:inline-flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:2px;border-radius:1px;vertical-align:middle;margin-right:5px}
.area{height:120px;margin:10px -4px 4px}.area svg{width:100%;height:100%;display:block}
.book{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;font-size:14px;font-variant-numeric:tabular-nums}
.book-hd{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:8px 0 6px}
.lvl{position:relative;display:flex;justify-content:space-between;padding:6px 4px;line-height:1.3}
.lvl i{position:absolute;top:2px;bottom:2px;border-radius:3px;opacity:.16}
.lvl.bid i{right:0;background:var(--up)}.lvl.ask i{left:0;background:var(--down)}
.lvl span{position:relative;color:var(--text)}
.lvl.bid .px{color:var(--up-text);font-weight:600}.lvl.ask .px{color:var(--down-text);font-weight:600}
.ratio{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;margin:12px 0 6px}
.ratio-bar{height:6px;border-radius:3px;overflow:hidden;display:flex;gap:2px;background:var(--inner2)}
.ratio-bar i{display:block;height:100%}.ratio-bar i.b{background:var(--up)}.ratio-bar i.a{background:var(--down);flex:1}
.mid{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;border-top:1px solid var(--track);border-bottom:1px solid var(--track);margin:6px 0}
.order{padding:16px;display:flex;flex-direction:column;gap:12px}
.order .between{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.order .between b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
.amount{display:flex;align-items:center;gap:8px;background:var(--inner);border-radius:var(--r-input);padding:6px 6px 6px 8px}
.amount .circ{width:36px;height:36px;background:var(--card);box-shadow:0 1px 2px rgba(12,16,13,.12),0 0 0 1px var(--ring)}
.amount input{flex:1;min-width:0;text-align:center;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:6px 0}
.amount .tok{height:36px;padding:0 10px 0 6px;border-radius:10px;background:var(--card);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(12,16,13,.12),0 0 0 1px var(--ring)}
.amount .tok .ic{width:14px;height:14px;color:var(--muted)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums;margin-top:-4px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets button{height:32px;border-radius:9px;background:var(--inner);color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.presets button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.swapdir{align-self:center;width:34px;height:34px;border-radius:11px;background:var(--card);box-shadow:0 1px 2px rgba(12,16,13,.12),0 0 0 1px var(--ring);display:grid;place-items:center;color:var(--accent-ink);margin:-4px 0}
.receive{display:flex;align-items:center;justify-content:space-between;gap:10px}
.receive strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.route{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-top:12px;border-top:1px solid var(--track)}
.route b{margin-left:auto;color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.route .badge{background:var(--up-soft);color:var(--up-text)}
.subtabs{display:flex;gap:22px;border-bottom:1px solid var(--track);margin-top:22px}
.subtabs button{padding:12px 0;font-size:14px;font-weight:600;color:var(--muted);position:relative;transition:color .2s}
.subtabs button[aria-selected="true"]{color:var(--text)}
.subtabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent-ink)}
.settings2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.settings2 .select,.settings2 .pill-static{height:46px;padding:0 14px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600}
.pill-static{background:var(--inner);border-radius:var(--r-input);color:var(--text)}
.trades{display:flex;flex-direction:column;font-size:14px;font-variant-numeric:tabular-nums}
.trades .t{display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px 4px;border-bottom:1px solid var(--track)}
.trades .t:last-child{border:0}.trades .t span:nth-child(2){text-align:center}.trades .t span:last-child{text-align:right;color:var(--muted)}

/* ===================== profile / empty / menu / toast ===================== */
.portfolio{padding:20px}
.portfolio .hero-num{margin:6px 0 8px}
.holdings .row{min-height:64px}
.act-icon{width:38px;height:38px;border-radius:12px;background:var(--inner);display:grid;place-items:center;color:var(--strong);flex:none}
.empty{padding:34px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .glyph{width:64px;height:64px;border-radius:20px;background:var(--inner);display:grid;place-items:center;color:var(--muted);margin-bottom:8px}
.empty .glyph .ic{width:28px;height:28px}
.empty b{font-size:16px;font-weight:600}.empty p{margin:0;font-size:14px;color:var(--muted);max-width:28ch}
.menu{position:absolute;inset:0;z-index:40;pointer-events:none}
.menu .backdrop{position:absolute;inset:0;background:rgba(6,8,12,0);transition:background .3s}
.menu.open{pointer-events:auto}.menu.open .backdrop{background:rgba(6,8,12,.42)}
.menu aside{position:absolute;top:0;bottom:0;left:0;width:84%;max-width:340px;background:var(--bg);box-shadow:var(--shadow-float);transform:translateX(-104%);transition:transform .34s cubic-bezier(.23,1,.32,1);padding:calc(var(--safe-top) + 62px) 18px 24px;overflow:auto;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.menu.open aside{transform:none}
.brandrow{display:flex;align-items:center;gap:10px;padding:0 4px}
.brandrow b{font-size:20px;letter-spacing:-.02em;font-weight:600}
.brandrow .circ{margin-left:auto;background:var(--inner)}
.markimg{width:34px;height:34px;object-fit:contain;flex:none;filter:var(--mark-filter)}
.wordmark{display:flex;flex-direction:column;min-width:0;flex:1}.wordmark small{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hq{font-weight:400}
.usercard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow-card),0 0 0 1px var(--ring)}
.usercard b{display:block;font-size:15px}.usercard small{display:block;font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:3px}
.menu nav{display:flex;flex-direction:column;gap:4px}
.menu nav button{display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border-radius:14px;font-size:15px;font-weight:500;color:var(--text);transition:background .15s}
.menu nav button .ic{color:var(--strong)}
.menu nav button:hover,.menu nav button:active{background:var(--inner)}
.menu nav button .chev{margin-left:auto;color:var(--muted);width:18px;height:18px}
.menu-sec{margin-top:6px;padding-top:14px;border-top:1px solid var(--track);display:flex;flex-direction:column;gap:10px}
.menu-sec .label{padding:0 4px}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:60;border-radius:var(--r-pill);padding:11px 18px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:84%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{font-weight:600;color:var(--accent-ink)}

/* ===================== studio ===================== */
.studio{width:284px;flex:none;position:sticky;top:28px;max-height:calc(100dvh - 56px);overflow:auto;scrollbar-width:none;background:var(--card);border-radius:24px;box-shadow:var(--shadow-card),0 0 0 1px var(--ring);padding:20px;color:var(--text)}
.studio::-webkit-scrollbar{display:none}
.studio-brand{display:flex;gap:12px;align-items:center}
.studio-brand strong{font-size:18px;letter-spacing:-.02em;display:block}
.studio-brand small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.studio-intro{font-size:14px;color:var(--muted);line-height:1.5;margin:18px 0 14px}
.studio-screens{display:flex;flex-direction:column;gap:2px}
.studio-screens button{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:12px;transition:background .15s}
.studio-screens button[aria-current]{background:var(--inner)}
.studio-screens button:hover{background:var(--inner)}
.studio-screens button>span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;width:18px}
.studio-screens b{font-size:14px;font-weight:600;display:block}
.studio-screens small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.studio-screens .chev{margin-left:auto;color:var(--muted);width:16px;height:16px}
.studio-sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--track);display:flex;flex-direction:column;gap:14px}
.studio-sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
.studio-sec label,.studio-sec .lbl{font-size:13px;color:var(--text);font-weight:500}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt output{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:10px}
.swatches button{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--card),0 0 0 1.5px var(--track);transition:transform .15s}
.swatches button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--card),0 0 0 2px var(--text);transform:scale(1.08)}
.studio-note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.studio-foot{font-size:12px;color:var(--muted);line-height:1.6;margin:18px 0 0}
.studio-close{display:none}
.hint{font-size:12px;color:var(--muted);margin:0}

/* ===================== responsive ===================== */
@media (max-width:759px){
  :root{--safe-top:env(safe-area-inset-top,0px)}
  .stage{padding:0;display:block;min-height:100dvh}
  .device{width:100%;height:100dvh;border-radius:0;padding:0;background:none;box-shadow:none}
  .device::before,.device::after{display:none}
  .edge{border-radius:0}
  .status{display:none}
  .topbar{top:calc(var(--safe-top) + 8px)}
  .scrim{height:calc(var(--safe-top) + 84px)}
  .screen{padding-top:calc(var(--safe-top) + 84px)}
  .tabbar{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  .studio{display:none;position:fixed;inset:0;width:100%;max-height:none;border-radius:0;z-index:90;padding:calc(var(--safe-top) + 18px) 20px 40px;background:var(--bg);box-shadow:none}
  .studio.open{display:block}
  .studio-close{display:grid;position:absolute;right:16px;top:calc(var(--safe-top) + 14px);width:40px;height:40px;border-radius:50%;background:var(--inner);place-items:center;color:var(--strong)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important}
</style>
</head>

function smoothPath(pts){
  if(pts.length<2)return"";
  const t=0.18,d=[`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d.push(`C${(p1[0]+(p2[0]-p0[0])*t).toFixed(1)},${(p1[1]+(p2[1]-p0[1])*t).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])*t).toFixed(1)},${(p2[1]-(p3[1]-p1[1])*t).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`);
  }
  return d.join(" ");
}

  const xl=["Sep 6","Sep 7","Sep 7","Sep 8"].map((t,i)=>`<text x="${(plotW*(i+0.5)/4).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${t}</text>`).join("");
  return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Illustrative ETH candlestick chart, ${state.trade.perps.period} interval" id="candleSvg" data-n="${data.length}" data-axis="${axisW}">${grid}${vols}${bars}${ma25}${ma7}${priceLine}${xl}</svg>`;
}
function bookLevels(){
  const r=rng(99);const asks=[],bids=[];let ca=0,cb=0;
  for(let i=0;i<8;i++){const sa=+(0.25+r()*4.5).toFixed(4),sb=+(0.25+r()*4.5).toFixed(4);ca+=sa;cb+=sb;asks.push({px:PERP.mid+0.5*(i+1)+0.15,sz:sa,cum:ca});bids.push({px:PERP.mid-0.5*(i+1)+0.15,sz:sb,cum:cb});}
  return{asks,bids,max:Math.max(ca,cb),buyPct:Math.round(cb/(ca+cb)*100)};
}
function recentTrades(){const r=rng(5);const out=[];let t=1441;for(let i=0;i<10;i++){const up=r()>0.45;out.push({px:PERP.mid+(r()-0.5)*3,sz:+(0.05+r()*1.8).toFixed(3),up,t:`07:${String(30-Math.floor(i/2)).padStart(2,"0")}:${String(Math.floor(r()*60)).padStart(2,"0")}`});t-=7;}return out;}

function seg(path,opts,val,{tone="",small=false,extra=""}={}){

function filterTokens(list,filter){

}

/* ===================== preferences & theme ===================== */
const STORAGE_KEY="dyorhq-preview-preferences-v2";
const root=document.documentElement;
const hostTheme=root.getAttribute("data-theme");
const DEFAULT_PREFS={theme:"system",accent:"#B9F26B",font:"geist",radius:20,textScale:1,glass:60,motion:true};
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=c=>"#"+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const lum=c=>{const[r,g,b]=c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return .2126*r+.7152*g+.0722*b;};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const mixRgb=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
function toward(from,to,surface,min){let c=from;for(let t=0;t<=1;t+=0.02){c=mixRgb(from,to,t);if(contrast(c,surface)>=min)break;}return c;}
/* Text-safe variants for any accent: an ink-leaning tint for light surfaces and a paper-leaning tint for dark
   surfaces that both clear 4.6:1, plus the fill/on-fill pair (light accents stay pure under ink text; dark
   accents darken under white text). */
function deriveAccent(hex){
  const a=hex2rgb(hex),ink=[12,16,13],paper=[242,245,238],white=[255,255,255],graphite=[27,33,29],onInk=lum(a)>0.35;
  return{inkL:rgb2hex(toward(a,ink,paper,4.6)),inkD:rgb2hex(toward(a,paper,graphite,4.6)),on:onInk?"#0C100D":"#FFFFFF",fill:onInk?hex:rgb2hex(toward(a,ink,white,4.6))};
}
function applyPrefs(){
  const p=state.prefs;
  if(p.theme==="system"){if(hostTheme)root.setAttribute("data-theme",hostTheme);else root.removeAttribute("data-theme");}else root.setAttribute("data-theme",p.theme);
  root.style.setProperty("--accent",p.accent);
  const d=deriveAccent(p.accent);root.style.setProperty("--accent-ink-light",d.inkL);root.style.setProperty("--accent-ink-dark",d.inkD);root.style.setProperty("--accent-fill-js",d.fill);root.style.setProperty("--on-accent-js",d.on);
  root.style.setProperty("--font",p.font==="inter"?"var(--alt)":"var(--sans)");
  root.style.setProperty("--r-card",p.radius+"px");
  root.style.setProperty("--r-row",Math.round(p.radius*.6)+"px");
  root.style.setProperty("--r-input",Math.round(p.radius*.7)+"px");
  root.style.setProperty("--text-scale",String(p.textScale));
  root.dataset.motion=p.motion?"on":"off";
  Glass.setIntensity(p.glass);
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(p));}catch(e){/* preview works without storage */}
}
function setAccent(c){state.prefs.accent=c;applyPrefs();$$(".swatches button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.swatch.toLowerCase()===c.toLowerCase())));const ci=$("#accentInput");if(ci&&ci.value!==c)ci.value=c;}
function loadPrefs(){
  try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(!s)return;const p=state.prefs;
    p.theme=["system","light","dark"].includes(s.theme)?s.theme:"system";
    p.accent=/^#[0-9a-f]{6}$/i.test(s.accent)?s.accent:DEFAULT_PREFS.accent;
    p.font=s.font==="inter"?"inter":"geist";
    p.radius=Math.max(12,Math.min(28,Number(s.radius)||20));
    p.textScale=Math.max(1,Math.min(1.2,Number(s.textScale)||1));
    p.glass=Number.isFinite(Number(s.glass))?Math.max(0,Math.min(100,Number(s.glass))):60;
    p.motion=typeof s.motion==="boolean"?s.motion:true;
  }catch(e){/* invalid or unavailable preferences use the defaults */}
}

/* ===================== liquid glass engine ===================== */
/* Chromium can run an SVG displacement filter inside backdrop-filter; the map bends the backdrop
   inward along the edge of each capsule (a lens rim). Other engines keep the frosted-blur fallback. */
const Glass=(()=>{
  const supported=!!navigator.userAgentData&&typeof CSS!=="undefined"&&CSS.supports("backdrop-filter","url(#x)");
  const defs=$("#lgDefs"),items=new Map();let n=0,intensity=60;
  function mapFor(w,h,r){
    const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");const img=ctx.createImageData(w,h),d=img.data;
    const rr=Math.min(r,w/2,h/2),band=Math.max(6,Math.min(w,h)*0.42);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const px=x+0.5-w/2,py=y+0.5-h/2,qx=Math.abs(px)-(w/2-rr),qy=Math.abs(py)-(h/2-rr);
      const dist=Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-rr;
      let t=1+dist/band;t=t<0?0:t>1?1:t;const s=t*t*(3-2*t);
      let nx,ny;if(qx>0||qy>0){nx=Math.max(qx,0)*Math.sign(px);ny=Math.max(qy,0)*Math.sign(py);}else if(qx>qy){nx=Math.sign(px);ny=0;}else{nx=0;ny=Math.sign(py);}
      const len=Math.hypot(nx,ny)||1;nx/=len;ny/=len;
      const i=(y*w+x)*4;d[i]=Math.round(128-nx*s*127);d[i+1]=Math.round(128-ny*s*127);d[i+2]=0;d[i+3]=255;
    }
    ctx.putImageData(img,0,0);return c.toDataURL();
  }
  function apply(el){
    if(!supported||intensity===0||!el.isConnected){el.style.backdropFilter="";el.style.webkitBackdropFilter="";return;}
    const w=Math.max(2,Math.round(el.offsetWidth)),h=Math.max(2,Math.round(el.offsetHeight));if(w<3||h<3)return;
    const rec=items.get(el);let f=document.getElementById(rec.id);
    if(!f){f=document.createElementNS("http://www.w3.org/2000/svg","filter");f.id=rec.id;defs.appendChild(f);}
    if(rec.w!==w||rec.h!==h){
      rec.w=w;rec.h=h;const r=parseFloat(getComputedStyle(el).borderTopLeftRadius)||Math.min(w,h)/2;
      f.setAttribute("filterUnits","userSpaceOnUse");f.setAttribute("x","0");f.setAttribute("y","0");f.setAttribute("width",w);f.setAttribute("height",h);f.setAttribute("color-interpolation-filters","sRGB");
      f.innerHTML=`<feImage href="${mapFor(w,h,r)}" width="${w}" height="${h}" result="m"/><feDisplacementMap in="SourceGraphic" in2="m" scale="0" xChannelSelector="R" yChannelSelector="G"/>`;
    }
    const dm=f.querySelector("feDisplacementMap");if(dm)dm.setAttribute("scale",(intensity/100*44).toFixed(1));
    const v=`url(#${rec.id}) blur(${(1.5+(100-intensity)/100*9).toFixed(1)}px) saturate(1.5)`;
    el.style.backdropFilter=v;el.style.webkitBackdropFilter=v;
  }
  const ro=typeof ResizeObserver!=="undefined"?new ResizeObserver(es=>{for(const e of es)apply(e.target);}):null;
  function scan(scope=document){$$("[data-glass]",scope).forEach(el=>{if(!items.has(el)){items.set(el,{id:"lg"+(n++)});if(ro)ro.observe(el);}apply(el);});}
  function setIntensity(v){intensity=v;items.forEach((_,el)=>apply(el));}
  function cleanup(){items.forEach((rec,el)=>{if(!el.isConnected){if(ro)ro.unobserve(el);const f=document.getElementById(rec.id);if(f)f.remove();items.delete(el);}});}
  return{scan,setIntensity,cleanup,supported};
})();

/* ===================== events ===================== */
function onSet(path,val){
  const cur=getPath(path),next=typeof cur==="number"?Number(val):val;
  setPath(path,next);
  if(path.startsWith("prefs.")){applyPrefs();renderMenu();renderStudio();return;}
  if(path==="trade.mode"){renderScreen();renderTopbar();return;}
  if(path==="launch.mode")state.launch.step=1;
  renderScreen({keepScroll:true});
}
function action(a,el){
  const d=el.dataset;
  switch(a){
    case"menu-open":state.menu=true;renderMenu();break;
    case"menu-close":state.menu=false;renderMenu();break;
    case"go-markets":setTab("markets");break;
    case"go-trade":setTab("trade",{mode:"swap"});break;
    case"go-profile":setTab("profile");break;
    case"go-create":state.launch.mode="create";state.launch.step=1;renderScreen();break;
    case"step-next":if(state.launch.step===3)toast("<b>$JENSEN</b> is ready to launch on Monad · sample");else{state.launch.step++;renderScreen();}break;
    case"step-back":state.launch.step=Math.max(1,state.launch.step-1);renderScreen();break;
    case"amt-step":{const v=Math.max(0,Math.min(SWAP_BALANCE,(Number(state.trade.amount)||0)+Number(d.d)));state.trade.amount=String(v);const i=$("#tradeAmt");if(i)i.value=v;updateSwap();break;}
    case"toggle-slippage":state.trade.slippage=!state.trade.slippage;renderScreen({keepScroll:true});break;
    case"confirm-trade":toast(`${state.trade.side==="Buy"?"Bought":"Sold"} <b>JENSEN</b> · sample order`);break;
    case"perps-preset":{state.trade.perps.amount=String(SWAP_BALANCE*Number(d.pct)/100);const i=$("#perpsAmt");if(i)i.value=state.trade.perps.amount;updatePerps();break;}
    case"perps-review":state.sheet="review";renderSheet();break;
    case"sheet-close":state.sheet=null;renderSheet();break;
    case"sheet-confirm":state.sheet=null;renderSheet();toast(`${state.trade.perps.side} ETH · sample order placed`);break;
    case"open-studio":state.menu=false;renderMenu();if(isPhone()){state.studioOpen=true;renderStudio();}else toast("Appearance controls are in the studio panel");break;
    case"close-studio":state.studioOpen=false;renderStudio();break;
    case"toggle-motion":state.prefs.motion=!state.prefs.motion;applyPrefs();renderStudio();break;
    case"studio-reset":state.prefs={...DEFAULT_PREFS};applyPrefs();renderStudio();renderMenu();break;
    case"toast":toast(esc(d.msg||"Sample preview"));break;
  }
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action],[data-tab],[data-set],[data-menu-tab],[data-studio-tab],[data-swatch]");
  if(!el)return;
  const d=el.dataset;
  if(d.tab){setTab(d.tab);return;}
  if(d.menuTab){setTab(d.menuTab);return;}
  if(d.studioTab){const s=d.studioTab;if(s==="perps")setTab("trade",{mode:"perps"});else if(s==="trade")setTab("trade",{mode:"swap"});else setTab(s);return;}
  if(d.swatch){setAccent(d.swatch);return;}
  if(d.set!==undefined){onSet(d.set,d.val);return;}
  action(d.action,el);
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(state.sheet){state.sheet=null;renderSheet();}else if(state.menu){state.menu=false;renderMenu();}else if(state.studioOpen){state.studioOpen=false;renderStudio();}});

/* ===================== boot ===================== */
(function boot(){
  loadPrefs();
  $("#edge").insertAdjacentHTML("beforeend",`<div class="sheet" id="sheet"><div class="backdrop" data-action="sheet-close"></div><div class="panel" id="sheetPanel" role="dialog" aria-modal="true" aria-label="Review order"></div></div>`);
  els.toast.dataset.glass="pill";
  applyPrefs();
  renderTabbar();renderScreen();renderTopbar();renderMenu();renderStudio();renderSheet();
  Glass.scan(document);
})();
</script>
